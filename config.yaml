general:
  seed: 42
  save_dir: ./checkpoints
  project: vehicle-dynamics
  entity: null
  run_name: null

data:
  raw_data_path: ../data/data_record5.npz 
  control_data_path: ../data/raw_control_data2.npz 
  train_data_path: ../data_processing/processed/train.npz
  val_data_path: ../data_processing/processed/val.npz
  test_data_path:  ../data_processing/processed/test.npz

training:
  batch_size: 512
  epochs: 200
  learning_rate: 0.0003
  warmup_epochs: 10
  patience: 30
  weight_decay: 0.00001

loss_weights:
  beta1: 0.6
  beta2: 0.3
  beta3: 0.000001

model:
  hidden_dim: 256
  dropout_rate: 0.1
  output_dim: 7